<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jornada na Palavra – Leitura Bíblica em Caravana</title>
<meta name="theme-color" content="#f2efe1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1705" media="(prefers-color-scheme: dark)">
<!-- Letra da marca: Cinzel (nome e títulos). O texto usa a letra do próprio celular. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap">
<!-- Ícone do atalho na tela inicial (iPhone e Android) e nome curto embaixo do ícone -->
<link rel="apple-touch-icon" href="icones/apple-touch-icon.png">

<link rel="icon" type="image/png" sizes="48x48" href="icones/favicon-48.png">
<link rel="icon" type="image/png" sizes="192x192" href="icones/icon-192.png">
<meta name="apple-mobile-web-app-title" content="Jornada">
<style>
:root{--bg:#f2efe1;--card:#fffdf6;--tx:#1c250f;--mut:#5a6150;--bd:#ddd6bd;--ac:#e6b04a;--acx:#14200a;--act:#8a5a08;--vd:#1b2a07;--vt:#e3e9d0;--ok:#3f6b2a;--err:#b3261e;--sh:0 1px 2px rgba(28,37,15,.06),0 6px 18px rgba(28,37,15,.07);
--ft:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--fd:Cinzel,"Trajan Pro",Georgia,serif;--fe:Georgia,"Times New Roman",serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1705;--card:#172309;--tx:#f2ead3;--mut:#b8b298;--bd:#2c3b18;--ac:#e6b04a;--acx:#14200a;--act:#f0c45c;--vd:#34501a;--vt:#22320d;--ok:#93c46e;--err:#ff8f80;--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1705;--card:#172309;--tx:#f2ead3;--mut:#b8b298;--bd:#2c3b18;--ac:#e6b04a;--acx:#14200a;--act:#f0c45c;--vd:#34501a;--vt:#22320d;--ok:#93c46e;--err:#ff8f80;--sh:none;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 var(--ft);padding-bottom:110px;max-width:560px;margin-inline:auto}
header{padding:12px 16px 6px}
h1{font:700 13px var(--ft);letter-spacing:.12em;text-transform:uppercase;color:var(--act);margin:0 0 4px}
/* Marca: o JORNADA dourado do logo, sem o círculo */
h1.brand{text-align:center;margin:0 0 8px;line-height:0}
h1.brand img{width:140px;height:auto;display:inline-block}
body[data-tab="feed"] #pt{display:none}body[data-tab="feed"] h1.brand{margin-bottom:2px}
#gate h1.brand{margin:4px 0 22px}#gate h1.brand img{width:250px}
/* Terra Prometida: a plantinha com fruto do logo */
.bro{height:1.3em;width:auto;vertical-align:-.3em}.land .bro{height:72px;display:block;margin:0 auto 6px}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) :is(h1.brand img,.tp,.bro){filter:brightness(.72) saturate(1.3)}}
:root[data-theme="light"] :is(h1.brand img,.tp,.bro){filter:brightness(.72) saturate(1.3)}
.land .bro{filter:none!important}
/* Cartão da caravana no Início */
/* Cartão da caravana no Início: compacto (nome, jornada, progresso e chegada em 4 linhas) */
.card.hc{padding:12px 14px 8px}
.hc-top{display:flex;align-items:center;gap:6px}
.hc-t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hc-t h2{display:inline;font:700 20px/1.3 var(--ft)}.hc-t .sub{font-size:15px}
.hc-more{flex:none;width:40px;height:40px;margin:-8px -8px -8px 0;border:0;border-radius:50%;background:none;color:var(--tx);font:700 20px/1 var(--ft);letter-spacing:1px;cursor:pointer}
.hc-r{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}
#jsw{display:flex;min-width:0}
.jpill{display:inline-flex;align-items:center;gap:6px;max-width:100%;min-height:38px;padding:6px 12px;border:1px solid var(--bd);border-radius:12px;background:none;color:var(--tx);font:600 15px var(--ft);cursor:pointer}
.jpill span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.jpill svg{flex:none}
.jpill .jb{flex:none;font-size:12px;padding:2px 7px;border-radius:99px;background:var(--ac);color:var(--acx)}
.pg-n{flex:none;color:var(--mut);font-size:15px}.pg-n b{color:var(--tx)}
.pway{display:block;width:100%;height:auto;overflow:visible;margin-top:4px}
.pw-t{fill:color-mix(in srgb,var(--ok) 38%,var(--card))}.pw-f{fill:var(--ac)}
.pw-d{fill:var(--ac)}.pw-h{fill:var(--ac);opacity:.25}
.hc-ft{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:2px;color:var(--mut);font-size:14px}
.hc-ft span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hc-ft .link{flex:none;font-size:14px;font-weight:600;text-decoration:underline;text-underline-offset:3px;padding:8px 0}
.jlist .jc{flex:none;width:100%;max-width:none;margin-top:8px}.jlist .jc b{white-space:normal}
h2{font:700 24px/1.2 var(--ft);margin:0}
#cn{font:700 25px/1.2 var(--fd);letter-spacing:.02em}
.sub{color:var(--mut);font-size:14px}
.err{color:var(--err);font-size:14px}
.trail{width:100%;height:auto;display:block;margin:6px 0 2px}
.road{fill:none;stroke:var(--act);stroke-width:4;stroke-dasharray:1 9;stroke-linecap:round}
.walked{fill:none;stroke:var(--act);stroke-width:5;stroke-linecap:round}
.stone{fill:var(--bd)}
.peer circle{fill:var(--card);stroke:var(--mut);stroke-width:1.5}
.peer text{font:700 10px var(--ft);fill:var(--tx);text-anchor:middle;dominant-baseline:central}
.me circle{fill:var(--ac)}
.lbl{font:600 11px var(--ft);fill:var(--mut)}
.stats{display:flex;gap:8px;margin-bottom:12px}
.stat{flex:1;background:var(--card);border:1px solid var(--bd);box-shadow:var(--sh);border-radius:14px;padding:10px 4px;text-align:center}
.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:var(--mut)}
main{padding:8px 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
.row{display:flex;align-items:center;gap:10px}
.av{width:40px;height:40px;border-radius:50%;background:var(--vd);color:var(--ac);display:grid;place-items:center;font-weight:700;flex:none;position:relative;overflow:hidden}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.av.md{width:54px;height:54px;font-size:22px}
.rkc{padding-bottom:10px}.rkc>b{display:block;margin-bottom:8px}
.seg.sm{margin-bottom:4px;padding:2px}.seg.sm button{padding:5px 2px;font-size:12.5px}
.rk.rk2{min-height:46px;padding:0;gap:9px}
.rk2 .pos{width:24px;flex:none;font-size:14px}
.rk2 .av{width:30px;height:30px;font-size:13px}
.rk2 .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;font-size:15px}
.rk2 .val{flex:none;font-size:15px}.rk2 .val small{color:var(--mut);font-weight:400;font-size:12px}
.rk2.me{background:var(--vt);border-radius:10px;border-bottom:0;margin:4px -8px 0;padding:0 8px}
.rkc .more{display:block;width:100%;margin-top:6px;padding:9px;text-align:center;font-size:14px}
.av.big{width:84px;height:84px;font-size:34px}
.grow{flex:1;min-width:0}
.ref{font-weight:700;margin:10px 0 2px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{font-size:12px;padding:2px 9px;border-radius:99px;background:var(--bg);border:1px solid var(--bd);color:var(--mut)}
.media{width:100%;border-radius:12px;margin-top:8px;display:block;max-height:520px;object-fit:cover;background:#000}
.car{position:relative;margin-top:8px}
.cart{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.cart::-webkit-scrollbar{display:none}
.cars{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always}
.vpause{position:relative;overflow:hidden;background:#172309;min-height:180px}.vpause img{display:block;width:100%;height:100%;max-height:520px;object-fit:cover;filter:brightness(.5)}
.vpause span{position:absolute;left:0;right:0;bottom:0;padding:12px 14px;color:#f2ead3;font-weight:600;font-size:15px;line-height:1.35;background:linear-gradient(transparent,rgba(0,0,0,.65))}
.cars .media{margin-top:0;border-radius:0;height:420px;max-height:62vh}
.carc{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-weight:700;padding:2px 9px;border-radius:10px;pointer-events:none}
.dots{display:flex;justify-content:center;gap:6px;margin-top:8px}
.dots button{width:8px;height:8px;border-radius:50%;border:0;padding:0;background:var(--bd);cursor:pointer}
.dots button.on{background:var(--ac)}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.mth{position:relative}
.mth img,.mth video{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block;background:#000}
.mth .mx{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:14px;cursor:pointer;padding:0}
.mth .mr{position:absolute;left:4px;right:4px;bottom:4px;border:0;border-radius:8px;background:rgba(0,0,0,.65);color:#fff;font-size:12px;padding:4px;cursor:pointer}
.tref{font:700 21px var(--fe);margin:2px 0 8px}
.card.hoje{border:2px solid var(--ac);background:linear-gradient(180deg,color-mix(in srgb,var(--ac) 14%,var(--card)),var(--card) 70%)}
.hj-l{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--act)}
.hoje .tref{font-size:28px;line-height:1.15;margin:6px 0 4px}
.hj-ch{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 6px}
.hj-ch .chip{margin:0;padding:10px 16px;font-size:17px;font-weight:700;background:var(--ac);color:var(--acx);border-color:var(--ac)}
.btn.o.hj-rd{text-align:center;font-weight:700;margin-top:12px}
.hj-ch .chip.ok{background:transparent;color:var(--ok);border:2px solid var(--ok)}
.vs{font-family:var(--fe);font-size:17px;line-height:1.6}
.vs sup{color:var(--act);font:700 11px var(--ft);margin:0 3px 0 4px}
.chip{display:inline-block;margin:8px 6px 0 0;padding:6px 12px;border-radius:99px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:14px;cursor:pointer}
.chip.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.act{display:flex;gap:18px;margin-top:6px}
.like{background:none;border:0;color:var(--mut);font-size:15px;padding:6px 0;cursor:pointer}
.like.on{color:#e0455a}
.cms{border-top:1px solid var(--bd);margin-top:8px;padding-top:8px}
.cm{font-size:14px;padding:4px 0}
.msgs{max-height:58vh;min-height:200px;overflow:auto;display:flex;flex-direction:column;gap:8px;margin-top:10px;padding:2px}
textarea.grow{resize:none;min-height:48px;max-height:180px;overflow-y:auto;line-height:1.35}
.msg{white-space:pre-wrap}
.txt{white-space:pre-wrap;overflow-wrap:anywhere}
.vbtn{font-size:15px;text-decoration:underline;margin-top:4px}
.row.send{align-items:flex-end}
.msg{align-self:flex-start;max-width:82%;background:var(--bg);border:1px solid var(--bd);border-radius:14px 14px 14px 4px;padding:7px 12px;font-size:15px;overflow-wrap:anywhere}
.msg b{display:block;font-size:12px;color:var(--act)}
.msg.me{align-self:flex-end;background:var(--ac);color:var(--acx);border-color:transparent;border-radius:14px 14px 4px 14px}
.msg small{display:block;font-size:11px;opacity:.65;text-align:right}
.land{background:radial-gradient(120% 90% at 50% 0%,#4a6b26,#1b2a07);color:#f2ead3;border:2px solid var(--ac);text-align:center}
.land .sub{color:#e4dcbf}
.land h2{color:#f8dd68}
nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;background:var(--card);border-top:1px solid var(--bd);padding:6px 4px calc(8px + env(safe-area-inset-bottom,0px));max-width:560px;margin-inline:auto;z-index:5;box-shadow:0 -2px 12px #0001}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;color:var(--mut);font:600 14px var(--ft);padding:4px 0;min-height:62px;justify-content:flex-end;cursor:pointer;-webkit-tap-highlight-color:transparent}
nav button span{display:grid;place-items:center;width:56px;height:34px;border-radius:17px;font-size:24px;line-height:1}
nav button.on{color:var(--act);font-weight:700}
nav button.on span{background:var(--bg);box-shadow:inset 0 0 0 2px var(--ac)}
nav .fab{color:var(--act);font-weight:700}
nav .fab span{width:66px;height:66px;border-radius:50%;background:var(--ac);color:var(--acx);font-size:30px;margin-top:-34px;box-shadow:0 4px 14px #0004;border:4px solid var(--card)}
.seg{display:flex;background:var(--vt);border-radius:10px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:8px 2px;border-radius:8px;color:var(--tx);font-size:13px;cursor:pointer}
.seg button.on{background:var(--ac);color:var(--acx);font-weight:700}
.rk{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.rk:last-child{border:0}.pos{width:24px;text-align:center;font-weight:700;color:var(--mut)}
.val{font-weight:700;font-size:18px;white-space:nowrap}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal>*{aspect-ratio:1;display:grid;place-items:center;border-radius:50%;font-size:13px;background:var(--bd);color:var(--mut)}
.cal button{border:0;font:inherit;font-size:13px;cursor:pointer;padding:0}
.cal .h{background:var(--ac);color:var(--acx);font-weight:700}
.cal .t{outline:2px solid var(--tx)}
.cal .w{background:none;aspect-ratio:auto;font-size:11px;border-radius:0}
.cal .ph{position:relative;overflow:hidden;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.9);box-shadow:inset 0 0 0 2px var(--ac)}
.cal .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%}
.cal .ph::after{content:'';position:absolute;inset:0;border-radius:50%;background:rgba(0,0,0,.2)}
.cal .ph span{position:relative;z-index:1;font-weight:700}
.cal .ph.vid span::after{content:' ▶';font-size:8px}
.lb{position:fixed;inset:0;z-index:100;background:#000;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:max(12px,env(safe-area-inset-top)) 0 max(16px,env(safe-area-inset-bottom))}
.lb[hidden]{display:none}
[data-who]{cursor:pointer;-webkit-tap-highlight-color:rgba(0,0,0,.08)}
.who-st{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 6px;text-align:center}
.who-st div{background:var(--bd);border-radius:12px;padding:8px 2px}.who-st b{display:block;font-size:20px}
.wp{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd);width:100%;background:none;border-left:0;border-right:0;border-top:0;color:inherit;font:inherit;text-align:left;cursor:pointer}
.wpr{display:flex;align-items:center;border-bottom:1px solid var(--bd)}.wpr .wp{border-bottom:0}
.wdel{flex:none;background:none;border:0;font-size:20px;padding:10px 4px 10px 10px;cursor:pointer}
.wp .th{width:56px;height:56px;border-radius:10px;flex:none;object-fit:cover;background:var(--bd);display:grid;place-items:center;font-size:22px;overflow:hidden}
.lb .top{display:flex;align-items:center;gap:10px;padding:4px 16px 10px;color:#fff}
.lb .x{margin-left:auto;flex:none;background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:50%;width:42px;height:42px;font-size:20px;cursor:pointer}
.lb .lbm{display:flex;overflow-x:auto;scroll-snap-type:x mandatory}
.lb .lbm>*{flex:0 0 100%;width:100%;max-height:72vh;object-fit:contain;background:#000;scroll-snap-align:center}
.lb .cap{color:#e8e8e8;padding:12px 16px 4px;white-space:pre-wrap;font-size:15px;line-height:1.45}
.lb audio{display:block;width:calc(100% - 32px);margin:10px 16px 0}
.lb .more{display:block;width:calc(100% - 32px);margin:14px 16px 0;color:#ddd;text-align:center}
.sheet{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:9}
.sheet.show{display:flex}
.sheet>div{background:var(--bg);width:100%;max-width:560px;margin:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
.btn{width:100%;margin-top:16px;padding:14px;border:0;border-radius:12px;background:var(--ac);color:var(--acx);font-size:17px;font-weight:700;cursor:pointer;font-family:inherit}
.btn:disabled{opacity:.5}
.btn.g{background:none;color:var(--mut);margin-top:4px}
.btn.o{background:var(--card);color:var(--tx);border:1px solid var(--bd);text-align:left;font-weight:400;margin-top:10px}
.btn.o b{font-weight:700}
label.btn{display:block;text-align:center;font-size:15px;color:var(--tx)}
.sbtn{width:auto;margin:0;padding:11px 16px}
a.btn{display:block;text-align:center;text-decoration:none}
.btn.wab{background:#25D366}
.wa{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:8px 14px;border-radius:99px;background:#25D366;color:#fff;font-weight:700;font-size:14px;text-decoration:none}
.two{display:flex;gap:8px}.two>*{flex:1;min-width:0}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:8px}
.bk{padding:14px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:600 16px var(--ft);cursor:pointer;text-align:left}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px;margin-top:12px}
.cgrid .chip{margin:0;padding:13px 0;text-align:center;font-size:17px}
.tst{font:700 13px var(--ft);letter-spacing:.1em;text-transform:uppercase;color:var(--act);margin:18px 0 0}
#bibx{line-height:1.75;margin-top:10px}
.link{background:none;border:0;color:var(--act);font-size:13px;cursor:pointer;padding:0}
.gate header,.gate #stats,.gate main,.gate nav{display:none}
#gate{display:none;padding:24px 18px 40px;font-size:18px}.gate #gate{display:block}
#gate h2{font-size:27px;margin:12px 0 6px}
#gate .sub{font-size:17px}
#gate label{font-size:17px;color:var(--tx);margin-top:16px}
#gate input{font-size:20px;padding:15px;margin-top:8px}
#gate .btn{font-size:20px;padding:17px}
#gate .err{font-size:17px;margin-top:10px}
#gate .link.big{display:block;font-size:17px;margin:22px auto 0;text-decoration:underline}
.steps{display:flex;gap:6px;margin:8px 0 6px}.steps i{flex:1;height:7px;border-radius:9px;background:var(--bd)}.steps i.on{background:var(--ac)}
.pw{position:relative}.pw input{padding-right:110px}.pw button{position:absolute;right:14px;top:50%;transform:translateY(-35%);font-size:16px}
.bib-i{display:inline-block;margin:2px 0 6px;font-size:14px}
.bi>div:last-child{margin-top:2px}
.jhd{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:10px}.jhd b{font-size:14px}.jhd .sub{font-size:12px;text-align:right}
.jsw{display:flex;gap:8px;overflow-x:auto;margin:6px -16px 8px;padding:2px 16px 8px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.jc{flex:0 0 74%;max-width:250px;display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 12px;font:inherit;color:var(--tx);cursor:pointer;scroll-snap-align:start}
.jc.on{border:2px solid var(--ac);padding:9px 11px;box-shadow:0 2px 10px #0002}

var BCACHE='biblia-v1';
async function cachedJson(url){
  var c=null;try{if(window.caches)c=await caches.open(BCACHE)}catch(e){}

  var r=await fetch(url);if(!r.ok)throw new Error('http '+r.status);
  if(c)try{await c.put(url,r.clone())}catch(e){}

function norm(t){return String(t).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}

// Descobre quais livros a jornada cobre a partir do nome e da descrição
function books(t){
  t=' '+norm(t).replace(/[^a-z0-9]+/g,' ')+' ';
  if(/ (antigo|velho) testamento /.test(t))return rg(0,38);
  if(/ novo testamento /.test(t))return rg(39,65);
  if(/ biblia /.test(t))return rg(0,65);
  if(/ evangelhos /.test(t))return rg(39,42);

  rg(0,65).sort(function(a,b){return BOOKS[b].length-BOOKS[a].length}).forEach(function(i){var n=' '+norm(BOOKS[i])+' ';if(t.indexOf(n)>=0){o[i]=1;t=t.split(n).join(' ')}});

function dayRead(c,i){var P=plan(c);if(!P)return[];var m=P.L.length,n=P.n;return P.L.filter(function(x,j){return Math.floor(j*n/m)===i})}

function refOf(R){

// ---- Caminho no formato da fita dourada do logo: sai de baixo à esquerda, sobe, faz uma onda e sobe até a plantinha ----
// way(x,y,w,h): o caminho dentro da caixa; at(f) dá o ponto a f (0 a 1) do comprimento; path(f) desenha até ali
var WAYC=[[[.02,.86],[.12,.62],[.23,.50],[.35,.54]],[[.35,.54],[.48,.58],[.56,.92],[.68,.90]],[[.68,.90],[.80,.88],[.88,.74],[.91,.56]]];
function way(x0,y0,w,h){
  var P=[];WAYC.forEach(function(c,k){for(var i=k?1:0;i<=40;i++){var t=i/40,u=1-t;P.push([0,1].map(function(j){return (j?y0:x0)+(u*u*u*c[0][j]+3*u*u*t*c[1][j]+3*u*t*t*c[2][j]+t*t*t*c[3][j])*(j?h:w)}))}});
  var L=[0];for(var i=1;i<P.length;i++)L.push(L[i-1]+Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]));
  var T=L[L.length-1];
  function at(f){var d=Math.max(0,Math.min(1,f))*T,i=1;while(i<L.length-1&&L[i]<d)i++;var r=(d-L[i-1])/((L[i]-L[i-1])||1);return[P[i-1][0]+r*(P[i][0]-P[i-1][0]),P[i-1][1]+r*(P[i][1]-P[i-1][1])]}
  function path(f){var d=Math.max(0,Math.min(1,f))*T,o='';for(var i=0;i<P.length&&L[i]<=d;i++)o+=(i?'L':'M')+P[i][0].toFixed(1)+' '+P[i][1].toFixed(1);var q=at(f);return o+'L'+q[0].toFixed(1)+' '+q[1].toFixed(1)}
  // fita: fina nas pontas e mais grossa no meio, como a do logo (até a fração f do caminho)
  function ribbon(f,mx){
    var d=Math.max(0,Math.min(1,f))*T,Q=[],A=[],B=[];
    for(var i=0;i<P.length&&L[i]<=d;i++)Q.push([P[i][0],P[i][1],L[i]]);
    var q=at(f);Q.push([q[0],q[1],d]);
    Q.forEach(function(p,k){var a=Q[Math.max(0,k-1)],b=Q[Math.min(Q.length-1,k+1)],dx=b[0]-a[0],dy=b[1]-a[1],n=Math.hypot(dx,dy)||1,g=p[2]/T,r=(1.4+(mx-1.4)*Math.pow(Math.sin(Math.PI*g),.7))/2;
      A.push((p[0]-dy/n*r).toFixed(1)+' '+(p[1]+dx/n*r).toFixed(1));B.push((p[0]+dy/n*r).toFixed(1)+' '+(p[1]-dx/n*r).toFixed(1))});
    return 'M'+A.join('L')+'L'+B.reverse().join('L')+'Z';
  }
  return{at:at,path:path,ribbon:ribbon,end:P[P.length-1]};
}

function trail(){
  var c=S.ch,tot=totalSteps(c),W=520,H=136,x0=24,wy=way(20,28,440,80),pt=wy.at,path=wy.path;
  var fm=Math.min(1,steps(S.me)/tot),m=pt(fm),ms='',k=Math.min(tot,14);
  for(var j=1;j<k;j++){var q=pt(j/k);ms+='<circle class="stone" cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="3"/>'}
  var all=users().slice().sort(function(a,b){return steps(b)-steps(a)}),vis=all.slice(0,TRAILN);
  var peers=vis.filter(function(u){return u!==S.me}).map(function(u){var p=pt(Math.min(1,steps(u)/tot));return '<g class="peer"><title>'+esc(nm(u))+': '+steps(u)+' passos</title><circle cx="'+p[0].toFixed(1)+'" cy="'+(p[1]-14).toFixed(1)+'" r="9"/><text x="'+p[0].toFixed(1)+'" y="'+(p[1]-14).toFixed(1)+'">'+esc(nm(u)[0])+'</text></g>'}).join('');
  var e=wy.end;
  return '<svg class="trail" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Mapa da jornada: você deu '+steps(S.me)+' de '+tot+' passos até a Terra Prometida">'+

    if(!S.all.some(function(x){return x.id===S.cur})){
      var sv=null;try{sv=localStorage.getItem('pd_cur')}catch(e){}
      var act=function(x){return TODAY>=x.start&&TODAY<=x.end},myL=S.all.filter(function(x){return S.myJ.indexOf(x.id)>=0});
      var inG=S.all.filter(function(x){return x.gid===S.grp.id});
      var ch=S.all.filter(function(x){return x.id===sv})[0]||myL.filter(act)[0]||myL[0]||inG.filter(act)[0]||inG[0];
      S.cur=ch?ch.id:null;
    }
    useCur();fv=feedVer(); // depois de saber as jornadas e antes de baixar as publicações
    var ids=S.all.map(function(x){return x.id}),rows=[],seen=new Set();
    if(ids.length){
      for(var from=0;from<20000;from+=1000){
        var k=await withTimeout(sb.from('checkins').select('*,likes(user_id),comments(id,user_id,body,created_at)').in('challenge_id',ids).order('created_at',{ascending:false}).order('id',{ascending:true}).range(from,from+999),30000);
        if(stale())return;
        if(k.error)throw k.error;
        (k.data||[]).forEach(function(r){if(!seen.has(r.id)){seen.add(r.id);rows.push(r)}});
        if(!k.data||k.data.length<1000)break;
      }
    }
    await loadRosters();if(stale())return;
    // nomes: só de quem aparece (antes baixava os nomes de todos os usuários do app)
    var want={};rows.forEach(function(p){want[p.user_id]=1;(p.comments||[]).forEach(function(c){want[c.user_id]=1})});if(S.me)want[S.me]=1;
    var miss=Object.keys(want).filter(function(u){return !S.names[u]});
    if(miss.length)await profs(miss);
    var paths=[].concat.apply([],rows.filter(function(p){return p.photo_path}).map(function(p){return p.photo_path.split(PSEP)}));
    var urls=await signed(paths.concat(paths.filter(canThumb).map(thumbOf)));if(stale())return;
    var pend=S.posts.filter(function(p){return p.local&&!rows.some(function(r){return r.id===p.id})});
    S.posts=pend.concat(rows.map(function(p){return toPost(p,urls)}));
    // escolhe automaticamente uma jornada sua só ao abrir o app (antes isso acontecia a cada 30 s
    // e tirava a pessoa da jornada que ela estava olhando)
    if(FIRST){FIRST=false;var mineL=S.all.filter(function(x){return isMine(x.id)});
      if(S.cur&&!isMine(S.cur)&&mineL.length){S.cur=(mineL.filter(function(x){return TODAY>=x.start&&TODAY<=x.end})[0]||mineL[0]).id;useCur()}}
    loaded=true;S.err='';setTimeout(thumbFill,3000);setTimeout(slimOwn,8000);setTimeout(dropSolto,5000);fv.then(function(v){if(!stale()&&!S.err)FV=v});
  }catch(e){
    if(stale())return;
    S.err='Não foi possível atualizar agora. '+why(e)+' Tentaremos de novo em instantes.';
  }
  render();
}
function toPost(p,urls){

  return{imgs:pl.map(function(x){var aud=isAudPath(x),vid=!aud&&(pl.length===1?p.media_type==='video':isVidPath(x)),t=!aud&&urls[thumbOf(x)];return{path:x,img:urls[x]||'',thumb:(!vid&&t)||urls[x]||'',poster:vid&&t||'',video:vid,audio:aud}}).filter(function(m){return m.img}),
    id:p.id,uid:p.user_id,cid:p.challenge_id,date:p.read_date,book:p.book,ref:p.ref||'—',ch:p.chapters,note:p.note||'',mt:p.media_type||'image',ms:p.media_source||'',min:p.study_minutes||0,

async function auth(){
  var em=val('ae').trim(),pw=val('ap');
  if(!/\S+@\S+\.\S+/.test(em)){gmsg('Digite o seu e-mail, por exemplo maria@gmail.com.');return}
  if(pw.length<6){gmsg(gm==='up'?'A senha precisa ter pelo menos 6 letras ou números.':'Digite a sua senha.');return}
  REG.email=em;
  var b=document.getElementById('ga');b.disabled=true;b.textContent='Aguarde…';
  if(gm==='up'){
    var r=await sb.auth.signUp({email:em,password:pw,options:{data:{name:REG.name,phone:'+55'+REG.ph},emailRedirectTo:redirTo()}});
    if(r.error){b.disabled=false;b.textContent='Criar meu cadastro';gmsg('Não foi possível criar o cadastro. '+why(r.error));return}
    // cadastro entra direto no app (sem confirmar e-mail); se o servidor não abriu a sessão, tenta entrar com a mesma senha
    var ses=r.data.session;
    if(!ses){var l2=await sb.auth.signInWithPassword({email:em,password:pw});ses=!l2.error&&l2.data.session}
    if(ses){S.names[ses.user.id]=REG.name;REG.step=1;boot()}else{REG.step=1;gate('mail')}
  }else{
    var l=await sb.auth.signInWithPassword({email:em,password:pw});
    if(l.error){b.disabled=false;b.textContent='Entrar';gmsg(why(l.error));return}
    boot();
  }
}

function init(){
  render();
  if(!window.supabase){document.getElementById('gate').textContent='Não foi possível carregar o app. Verifique a conexão.';return}
  // Links que voltam do e-mail: criar nova senha ou link vencido
  var hs=location.hash+'&'+location.search;
  S.recovery=/type=recovery/.test(hs);
  if(/error_code=|error_description=/.test(hs)){S.linkErr=/expired/i.test(decodeURIComponent(hs))?'Esse link do e-mail venceu. Entre com seu e-mail e senha, ou toque em “Esqueci minha senha” para receber outro.':'Não foi possível usar o link do e-mail. Tente entrar com seu e-mail e senha.';history.replaceState(null,'',location.pathname+location.search.replace(/[?&](error|error_code|error_description)=[^&]*/g,''))}
  sb=supabase.createClient(SB_URL,SB_KEY);
  sb.auth.onAuthStateChange(function(ev){if(ev==='PASSWORD_RECOVERY'){S.recovery=true;gate('newpw')}});
  readInv();
  boot().then(function(){if(INV&&!S.me&&!S.linkErr&&gm==='in'){REG.step=1;gate('up')}});
  setInterval(function(){var t=iso(new Date()),nd=t!==TODAY;TODAY=t;if(S.me&&S.grp&&!document.hidden&&!document.getElementById('sh').classList.contains('show')){if(nd)loadData();else poll()}},30000);
  setInterval(function(){if(!document.hidden)loadChat()},5000);
  // fotos guardadas no aparelho (sw.js): cada foto é baixada uma vez só, mesmo quando o link assinado muda
  try{if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(function(){})}catch(e){}
}
init();
